[project]
name = "fable-harness"
version = "0.1.0"
description = "Thin-harness-with-thick-seams AI agent runtime — POC/MVP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=2.5",
    "pydantic-settings>=2.7",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "semantic-router>=0.1.15",
    # OpenAIEncoder (semantic-router's OpenAI DenseEncoder) backs both tier-1
    # routing and pgvector memory embeddings — both installed transitively via
    # semantic-router already, promoted to direct deps since the code now
    # depends on them directly (harness/routing/embeddings.py).
    "openai>=2.44",
    "tiktoken>=0.13",
    "mcp==1.28.*",
    "pgvector>=0.4",
    "asyncpg>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = [
    "deepeval>=4.0",
    "ragas>=0.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[project.scripts]
harness = "harness.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["harness/evals"]
# ablations.py is also a standalone report generator (`uv run python -m
# harness.evals.ablations`), so it doesn't match the test_*.py naming
# convention — include it explicitly so its test_* functions still run in CI.
python_files = ["test_*.py", "ablations.py"]
